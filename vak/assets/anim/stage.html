<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<link rel="stylesheet" href="../node_modules/@fontsource/tiro-devanagari-sanskrit/index.css">
<script src="core.js"></script>
<script id="style"></script>
</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
  // anim.js loads the style file named in ?style= before calling setup()/draw().
  // A style that extends another sets window.STYLE_BASE and window.STYLE_EXT: the base loads first, then STYLE_EXT() runs.
  const load = (name, done) => { const el = document.createElement('script'); el.src = name + '.js'; el.onload = done; document.head.appendChild(el); };
  const s = new URLSearchParams(location.search).get('style') || 'shadow_puppet';
  load(s, () => {
    if (!window.STYLE_BASE) { window.styleReady = true; return; }
    load(window.STYLE_BASE, () => { window.STYLE_EXT(); window.styleReady = true; });
  });
</script>
</body></html>
